<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Bennerdo Browser</title>
  <link rel="stylesheet" href="styles/index.css">
</head>

<body>
  <!-- Custom window controls -->
  <div class="titlebar">
    <div class="drag-region"></div>
    <div class="window-controls">
      <button class="window-btn" id="minimize-btn">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <line x1="0" y1="6" x2="12" y2="6" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>
      <button class="window-btn" id="maximize-btn">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <rect x="1" y="1" width="10" height="10" stroke="currentColor" stroke-width="1.5" fill="none" />
        </svg>
      </button>
      <button class="window-btn close-btn" id="close-btn">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <line x1="1" y1="1" x2="11" y2="11" stroke="currentColor" stroke-width="1.5" />
          <line x1="11" y1="1" x2="1" y2="11" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Main browser layout -->
  <div class="browser-container">
    <!-- Vertical tab sidebar -->
    <aside class="tab-sidebar">
      <div class="sidebar-header">
        <button class="new-tab-btn" id="new-tab-btn" title="New Tab">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M10 4V16M4 10H16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div class="tabs-container" id="tabs-container">
        <!-- Tabs will be dynamically added here -->
      </div>
      <div class="privacy-stats">
        <div class="stat-item">
          <div class="stat-icon shield-icon"></div>
          <div class="stat-info">
            <span class="stat-value" id="trackers-blocked">0</span>
            <span class="stat-label">Blocked</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main content area -->
    <main class="main-content">
      <!-- Navigation bar -->
      <nav class="navigation-bar">
        <div class="nav-controls">
          <button class="nav-btn" id="back-btn" title="Back" disabled>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </button>
          <button class="nav-btn" id="forward-btn" title="Forward" disabled>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M6 12L10 8L6 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </button>
          <button class="nav-btn" id="reload-btn" title="Reload">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path
                d="M14 8C14 11.3137 11.3137 14 8 14C4.68629 14 2 11.3137 2 8C2 4.68629 4.68629 2 8 2C10.3 2 12.3 3.3 13.3 5.2"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="M13 2V5.5H9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </button>
        </div>

        <div class="url-bar-container">
          <div class="privacy-shield" title="Privacy Protection Active">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M7 1L2 3V6.5C2 9.5 4.5 12 7 13C9.5 12 12 9.5 12 6.5V3L7 1Z" stroke="currentColor"
                stroke-width="1.5" fill="none" />
            </svg>
            <span class="shield-badge" id="page-blocks">0</span>
          </div>
          <input type="text" class="url-bar" id="url-bar" placeholder="Search or enter address">
        </div>

        <button class="nav-btn menu-btn" id="menu-btn" title="Menu">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="3" r="1.5" fill="currentColor" />
            <circle cx="8" cy="8" r="1.5" fill="currentColor" />
            <circle cx="8" cy="13" r="1.5" fill="currentColor" />
          </svg>
        </button>

        <!-- Settings Menu Dropdown -->
        <div class="settings-menu" id="settings-menu">
          <div class="menu-section">
            <div class="menu-item" id="menu-devtools">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M2 4L8 2L14 4V8C14 11 11 14 8 15C5 14 2 11 2 8V4Z" stroke="currentColor" stroke-width="1.5"
                  fill="none" />
              </svg>
              <span>Open DevTools</span>
            </div>
            <div class="menu-item" id="menu-clear-cache">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M14 8C14 11.3 11.3 14 8 14C4.7 14 2 11.3 2 8C2 4.7 4.7 2 8 2C10.3 2 12.3 3.3 13.3 5.2"
                  stroke="currentColor" stroke-width="1.5" />
              </svg>
              <span>Clear Cache</span>
            </div>
          </div>
          <div class="menu-divider"></div>
          <div class="menu-section">
            <div class="menu-item menu-toggle">
              <div class="toggle-label">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5" fill="none" />
                </svg>
                <span>Block Ads</span>
              </div>
              <div class="toggle-switch active" id="toggle-ads">
                <div class="toggle-slider"></div>
              </div>
            </div>
            <div class="menu-item menu-toggle">
              <div class="toggle-label">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path d="M3 8C3 8 5 4 8 4C11 4 13 8 13 8C13 8 11 12 8 12C5 12 3 8 3 8Z" stroke="currentColor"
                    stroke-width="1.5" fill="none" />
                  <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5" fill="none" />
                </svg>
                <span>Force HTTPS</span>
              </div>
              <div class="toggle-switch active" id="toggle-https">
                <div class="toggle-slider"></div>
              </div>
            </div>
          </div>
          <div class="menu-divider"></div>
          <div class="menu-section">
            <div class="menu-item" id="menu-about">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5" fill="none" />
                <path d="M8 7V11M8 5V5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              </svg>
              <span>About Bennerdo Browser</span>
            </div>
          </div>
        </div>
      </nav>

      <!-- Loading progress bar -->
      <div class="loading-bar" id="loading-bar"></div>

      <!-- BrowserView will be rendered here by Electron -->
      <div class="browser-view-placeholder"></div>
    </main>
  </div>

  <!-- Background effects -->
  <div class="background-gradient"></div>

  <script type="module" src="app.js"></script>
</body>

</html>
